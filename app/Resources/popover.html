<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>contexta</title>
<style>
/* One popover, 352 points wide, light. Its height is its content's height (the app sizes the popover to it, within the
   screen); only the list of sources or tags scrolls when there is more than fits. Regular weight everywhere: the order
   of things, size and two greys carry the hierarchy. */
:root{color-scheme:light;--paper:#fafafa;--sheet:#fff;--ink:#313438;--soft:#61666b;--rule:#e2e4e6;--rule-strong:#c9cdd0;--field:#878d93;--accent:#33566a;--tint:#eef3f5;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Apple SD Gothic Neo","Segoe UI","Noto Sans","Noto Sans CJK KR","DejaVu Sans",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper)}
html{overflow:hidden}
body{color:var(--ink);font:400 13px/1.4 var(--sans);overflow:hidden;overflow-wrap:anywhere;cursor:default;-webkit-user-select:none;user-select:none}
#frame{display:flex;flex-direction:column;width:100%}
p,h2{margin:0;padding:0;font:inherit}
button,input{font:inherit;color:inherit;margin:0}
[hidden]{display:none!important}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
main{flex:none;display:flex;flex-direction:column;overflow-x:hidden}
main.clamped{overflow-y:auto}

/* the selected item */
#item{padding:9px 12px 8px;border-bottom:1px solid var(--rule)}
.cap{font-size:11.5px;line-height:15px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#itemTitle{margin-top:1px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;line-height:18px;-webkit-user-select:text;user-select:text}
#itemPath{margin-top:1px}
.tokens{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:7px}
#tagTokens{display:contents}
.token{display:inline-flex;align-items:center;max-width:100%;min-height:24px;border-radius:5px;background:var(--tint);color:var(--accent);padding-left:8px;font-size:12.5px}
.token .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.token .rm{border:0;background:none;width:22px;height:24px;padding:0;font-size:14px;line-height:1;color:var(--accent);cursor:pointer;border-radius:0 5px 5px 0}
.token .rm:hover{background:#dde7ec}
input[type=text]{flex:1;min-width:96px;height:28px;padding:3px 8px;border:1px solid var(--field);border-radius:5px;background:var(--sheet);-webkit-user-select:text;user-select:text;cursor:text}
input[type=text]::placeholder{color:var(--soft);opacity:1}
input[type=text]:disabled{background:transparent;border-color:var(--rule-strong)}
.btn{height:28px;padding:0 10px;border-radius:5px;border:1px solid var(--field);background:var(--sheet);cursor:pointer;white-space:nowrap}
.btn:disabled{border-color:var(--rule-strong);color:var(--soft);cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:disabled{background:var(--tint);border-color:var(--rule);color:var(--soft)}
.btn .key{margin-left:8px;font-size:11.5px;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px}
.chips .lead{font-size:11.5px;color:var(--soft);margin-right:1px}
.chip{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:12px;padding:0 9px;height:24px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--field)}
.chip[aria-pressed=true]{border-color:var(--accent);background:var(--tint);color:var(--accent)}
.msg{font-size:12px;line-height:16px;color:var(--soft)}
.msg.on{color:var(--ink)}
#tagMsg{margin-top:6px;min-height:16px}
#itemNone .lead{color:var(--ink)}
#itemNone .more{margin-top:2px}
.acts{display:flex;gap:6px;margin-top:7px}
#itemLine{display:flex;align-items:center;gap:6px;width:100%;height:26px;margin:-3px 0 -2px;padding:0;border:0;background:none;text-align:left;cursor:pointer}
#itemLine .k{font-size:11.5px;color:var(--soft);flex:none}
#itemLine .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#itemLine .tg{flex:none;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;color:var(--accent);background:var(--tint);border-radius:4px;padding:1px 6px}
#itemLine .go{flex:none;font-size:11.5px;color:var(--accent)}
#itemLine:hover .go{text-decoration:underline;text-underline-offset:2px}

/* find context */
#find{display:flex;flex-direction:column;padding:8px 12px 0}
.row{display:flex;gap:6px}
#summaryRow{display:flex;align-items:center;gap:8px;margin-top:4px;min-height:22px}
#summary{flex:1}
.link{border:0;border-radius:4px;background:none;padding:0 5px;min-height:22px;min-width:24px;color:var(--accent);cursor:pointer;font-size:11.5px}
.link:hover{background:var(--tint)}
progress{display:block;width:100%;height:3px;margin-top:2px;border:0;border-radius:2px;background:var(--rule);-webkit-appearance:none;appearance:none}
progress::-webkit-progress-bar{background:var(--rule);border-radius:2px}
progress::-webkit-progress-value{background:var(--accent);border-radius:2px}
#sources{overflow-y:auto;overscroll-behavior:contain;margin:3px -12px 0;padding:0 12px;border-top:1px solid var(--rule)}
#sources:empty,#sources.bare{border-top-color:transparent}
.hint{padding:8px 0;font-size:12px;color:var(--soft)}
.group{padding:7px 0 3px;font-size:11.5px;color:var(--soft);border-top:1px solid var(--rule)}
.src{padding:3px 0 4px;border-top:1px solid var(--rule)}
.src:first-child,.group:first-child{border-top:0}
.src .pick{display:flex;align-items:center;gap:6px;height:21px;cursor:pointer}
.src .pick input{flex:none;width:14px;height:14px;margin:0 2px 0 0;accent-color:var(--accent)}
.badge{flex:none;min-width:22px;text-align:center;font-size:11px;line-height:15px;border:1px solid var(--field);color:var(--ink);border-radius:3px;padding:0 3px}
.src .t{flex:1;min-width:0;line-height:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src .flag{flex:none;font-size:11px;line-height:15px;border:1px dashed var(--ink);border-radius:3px;padding:0 4px}
.src .more{display:block;position:relative;width:calc(100% - 22px);margin-left:22px;padding:0 16px 0 0;border:0;background:none;text-align:left;cursor:pointer;font-size:12px;line-height:15px;color:var(--soft)}
.src .more span{display:block;height:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src .more .ex{color:var(--ink)}
.src .more .chev{position:absolute;right:0;top:0;width:14px;text-align:right;overflow:visible}
.src.off .t,.src.off .more .ex{color:var(--soft)}
.src.gone .more .ex{color:var(--soft)}
.quote{margin:4px 0 2px 22px;border-left:2px solid var(--accent);padding-left:8px;font-size:12px;line-height:1.45;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.quote + .link{margin-left:22px}
.copybar{display:flex;gap:10px;align-items:center;padding:5px 0 6px;border-top:1px solid var(--rule)}
.copybar .msg{flex:1;font-size:11.5px;line-height:15px}
/* the toolbar along the bottom: borderless buttons, a highlight on hover, the same focus ring as everything else,
   drawn inside the button so the popover's rounded corners never cut it. Quit is the quiet one, at the far end. */
footer{flex:none;display:flex;align-items:center;gap:2px;padding:5px 7px 7px;border-top:1px solid var(--rule);background:var(--paper)}
.tool{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--ink);font-size:12px;line-height:1;white-space:nowrap;cursor:pointer}
.tool svg{flex:none;width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;color:var(--soft)}
.tool:hover{background:#ebedef}
.tool:active{background:#e1e4e7}
.tool[aria-pressed=true]{background:var(--tint);color:var(--accent)}
.tool[aria-pressed=true] svg{color:var(--accent)}
.tool:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.tool.quiet{margin-left:auto;padding:0 7px;color:var(--soft)}
.tool.quiet:hover{color:var(--ink)}
/* manage tags */
#manage{display:none;flex-direction:column;padding:9px 12px 8px}
body[data-mode=manage] #manage{display:flex}
body[data-mode=manage] #item,body[data-mode=manage] #find{display:none}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#managePick{display:flex;flex-direction:column}
#managePick input,#renameForm input{flex:none;width:100%}
#manageList{overflow-y:auto;overscroll-behavior:contain;margin-top:6px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.tagrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:26px;padding:0 2px;border:0;border-top:1px solid var(--rule);background:none;text-align:left;cursor:pointer}
.tagrow:first-child{border-top:0}
.tagrow:hover{background:var(--tint)}
.tagrow .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagrow .c{flex:none;font-size:12px;color:var(--soft)}
#manageMsg{margin-top:6px;min-height:16px}
#renameForm{display:flex;flex-direction:column}
#renameTitle{margin-bottom:6px}
#renamePlan{margin-top:8px;font-size:12px;line-height:16px}
#renamePlan p+p{margin-top:3px}
#renamePlan .warn{color:var(--ink)}
#renameNote{padding-top:10px}
.acts2{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
body[data-mode=find] #itemFull,body[data-mode=find] #itemNone{display:none}
body[data-mode=find] #item{padding:6px 12px 5px}
body[data-mode=tag] #itemLine{display:none}
@media (prefers-contrast:more){:root{--soft:#43474b;--rule:#b9bdc1;--rule-strong:#878d93;--field:#5c6166}}
</style>
</head>
<body data-mode="tag">
<div id="frame">
<main id="main">
<section id="item" aria-labelledby="hItem">
  <h2 class="vh" id="hItem">Selected item</h2>
  <div id="itemFull">
    <div id="object">
      <p class="cap" id="itemCap"></p>
      <p id="itemTitle" dir="auto"></p>
      <p class="cap" id="itemPath"></p>
    </div>
    <form id="tagForm" class="tokens" novalidate>
      <span id="tagTokens" role="list" aria-label="Tags on this item"></span>
      <input type="text" id="tagField" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Add a tag" aria-label="Add a tag to this item" aria-describedby="tagMsg">
      <button class="btn" type="submit" id="addBtn" disabled>Add</button>
    </form>
    <div class="chips" id="tagChips" role="group" aria-label="Tag this item as one of the recent tags"></div>
    <p class="msg" id="tagMsg" role="status"></p>
  </div>
  <div id="itemNone" hidden>
    <p class="lead" id="noneMsg" role="status"></p>
    <p class="msg more" id="noneMore"></p>
    <div class="acts" id="noneActs"></div>
  </div>
  <button type="button" id="itemLine" aria-expanded="false" aria-controls="itemFull"></button>
</section>

<section id="find" aria-labelledby="hFind">
  <h2 class="vh" id="hFind">Find context</h2>
  <form id="lookupForm" class="row" novalidate>
    <input type="text" id="lookupField" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Look up a tag to copy its sources" aria-label="Look up a tag to copy its sources">
    <button class="btn" type="submit" id="findBtn">Find</button>
  </form>
  <div class="chips" id="lookupChips" role="group" aria-label="Look up one of the tags in use"></div>
  <div id="summaryRow">
    <p class="msg" id="summary" role="status"></p>
    <button type="button" class="link" id="allBtn" hidden>All</button>
    <button type="button" class="link" id="noneBtn" hidden>None</button>
  </div>
  <progress id="progress" max="1" value="0" hidden aria-label="Reading sources"></progress>
  <div id="sources" role="group" aria-label="Sources for this tag, oldest first"></div>
  <div class="copybar" id="copybar">
    <button class="btn primary" type="button" id="copyBtn" disabled aria-keyshortcuts="Meta+Enter">Copy</button>
    <p class="msg" id="copyMsg" role="status">Nothing is sent. You paste it.</p>
  </div>
</section>
<section id="manage" aria-labelledby="hManage">
  <div class="mhead"><h2 id="hManage">Manage tags</h2><button type="button" class="link" id="manageDone">Done</button></div>
  <div id="managePick">
    <input type="text" id="manageSearch" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Search tags" aria-label="Search tags">
    <div id="manageList" role="group" aria-label="Tags, with the number of sources each one is on. Press one to rename it everywhere."></div>
    <p class="msg" id="manageMsg" role="status"></p>
  </div>
  <form id="renameForm" novalidate hidden>
    <p id="renameTitle"></p>
    <input type="text" id="renameField" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="New name" aria-label="New name for this tag" aria-describedby="renamePlan">
    <div id="renamePlan" role="status"></div>
    <p class="msg" id="renameNote">Only contexta's own index changes. Your files, mail and notes are not touched.</p>
    <div class="acts2"><button type="button" class="btn" id="renameCancel">Cancel</button><button type="submit" class="btn primary" id="renameBtn" disabled>Rename</button></div>
  </form>
</section>
</main>
<footer id="footer" role="toolbar" aria-label="contexta" aria-orientation="horizontal">
  <button type="button" class="tool" id="accessBtn" title="Which apps contexta may ask, and macOS permission for each"><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="6.2" width="9" height="6.3" rx="1.4"/><path d="M4.6 6.2V4.4a2.4 2.4 0 0 1 4.8 0v1.8"/></svg>App access</button>
  <button type="button" class="tool" id="prefsBtn" title="Shortcut and Insert context"><svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="1.9"/><path d="M7 1.6v1.6M7 10.8v1.6M1.6 7h1.6M10.8 7h1.6M3.2 3.2l1.1 1.1M9.7 9.7l1.1 1.1M3.2 10.8l1.1-1.1M9.7 4.3l1.1-1.1"/></svg>Settings</button>
  <button type="button" class="tool" id="manageBtn" aria-pressed="false" title="Rename or merge a tag everywhere"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1.9 2.9a1 1 0 0 1 1-1h3.6a1 1 0 0 1 .7.3l5 5a1 1 0 0 1 0 1.4l-3.6 3.6a1 1 0 0 1-1.4 0l-5-5a1 1 0 0 1-.3-.7z"/><circle cx="4.7" cy="4.7" r=".9"/></svg>Manage tags</button>
  <button type="button" class="tool quiet" id="quitBtn" aria-label="Quit contexta" title="Quit contexta">Quit</button>
</footer>
</div>

<script>
/* contexta v9 — core rules (pure: no file, network or OS access).
 *
 * Model: a local tag points to a WHOLE source object (one email message, one note, one saved file such
 * as an entire workbook). The index is current-state only:
 *   - one entry (binding) per source object, found by a stable identifier, holding at most two tags
 *   - the entry stores a locator, a title, the source's own date and what kind of date that is, and
 *     the time the tag was captured. It never stores source content, excerpts, cell values, hashes,
 *     revisions or snapshots.
 *   - content is read from the source at lookup time and passed straight through; nothing is cached.
 */
var WorkIndexCore = (function () {
  'use strict';

  var VERSION = '0.12.3';
  var MAX_TAGS = 2;
  var LOOKUP_PREFIX = '::';
  var NAME_CHAR = /[\p{L}\p{M}\p{N}_-]/u;
  var NAME_ONLY = /^[\p{L}\p{M}\p{N}_-]+$/u;
  var HAS_LETTER = /\p{L}/u;
  var MAX_TAG_LENGTH = 40;

  /* ───────── tags ───────── */
  function tagKey(name) { return String(name).normalize('NFC').toLowerCase(); }

  /* one tag as typed in the tag field: "Cost", "::Cost" or "#Cost" */
  function cleanTag(raw) {
    var s = String(raw == null ? '' : raw).normalize('NFC').trim();
    if (s.indexOf(LOOKUP_PREFIX) === 0) s = s.slice(LOOKUP_PREFIX.length);
    else if (s.charAt(0) === '#' || s.charAt(0) === '\uFF03') s = s.slice(1);
    if (!s) return { ok: false, reason: 'empty', raw: String(raw) };
    if (s.length > MAX_TAG_LENGTH && Array.from(s).length > MAX_TAG_LENGTH) return { ok: false, reason: 'too-long', raw: String(raw) };
    if (!NAME_ONLY.test(s)) return { ok: false, reason: 'bad-character', raw: String(raw) };
    if (!HAS_LETTER.test(s)) return { ok: false, reason: 'needs-a-letter', raw: String(raw) };
    if (s.charAt(0) === '-') return { ok: false, reason: 'bad-character', raw: String(raw) };
    return { ok: true, name: s, key: tagKey(s) };
  }

  /* the tag field: tags separated by spaces or commas; duplicates collapse */
  function parseTagInput(input) {
    var parts = String(input == null ? '' : input).split(/[\s,\u3001\uFF0C]+/).filter(Boolean);
    var tags = [], errors = [], seen = {};
    parts.forEach(function (p) {
      var t = cleanTag(p);
      if (!t.ok) { errors.push(t); return; }
      if (seen[t.key]) return;
      seen[t.key] = 1; tags.push({ name: t.name, key: t.key });
    });
    return { tags: tags, errors: errors };
  }

  /* a chat message or lookup field: every "::Name" that starts a word.
     "std::vector" or "a::b" are not lookups; "::" alone is not a lookup. */
  function parseLookup(text) {
    var s = String(text == null ? '' : text).normalize('NFC');
    var re = /(^|[\s(\[{"'\u201C\u2018,;])::([\p{L}\p{M}\p{N}_-]+)/gu, m, tags = [], seen = {};
    while ((m = re.exec(s))) {
      var t = cleanTag(m[2]);
      if (t.ok && !seen[t.key]) { seen[t.key] = 1; tags.push({ name: t.name, key: t.key }); }
    }
    return { tags: tags };
  }

  /* ───────── identity ───────── */
  var TRACKING = /^(utm_[a-z]+|fbclid|gclid|dclid|msclkid|mc_cid|mc_eid|igshid|ref_src|ref_url|_hsenc|_hsmi|vero_id|yclid)$/i;

  /* A web link becomes a stable identifier: the same message, sheet or page opened through different
     links (labels, tabs within a workbook, tracking parameters) is one object. */
  function describeUrl(input, title) {
    var u;
    try { u = new URL(String(input).trim()); } catch (e) { return { ok: false, reason: 'not-a-link' }; }
    if (u.protocol !== 'http:' && u.protocol !== 'https:') return { ok: false, reason: 'unsupported-link' };
    var host = u.hostname.toLowerCase(), path = u.pathname, m;
    var kind = 'page', id = null, canonical = null;
    if (host === 'docs.google.com' && (m = path.match(/^\/spreadsheets\/(?:u\/\d+\/)?d\/([A-Za-z0-9_-]+)/))) {
      kind = 'workbook'; id = 'gsheet:' + m[1]; canonical = 'https://docs.google.com/spreadsheets/d/' + m[1];
    } else if (host === 'docs.google.com' && (m = path.match(/^\/(document|presentation)\/(?:u\/\d+\/)?d\/([A-Za-z0-9_-]+)/))) {
      kind = m[1] === 'document' ? 'note' : 'file'; id = 'gdoc:' + m[2]; canonical = 'https://docs.google.com/' + m[1] + '/d/' + m[2];
    } else if (host === 'mail.google.com') {
      var seg = u.hash.replace(/^#/, '').split('?')[0].split('/').filter(Boolean);
      var token = seg.length > 1 ? seg[seg.length - 1] : '';
      if (!token || token.length < 10) return { ok: false, reason: 'not-one-message' };   /* an inbox or a search, not a message */
      kind = 'email'; id = 'gmail:' + token; canonical = 'https://mail.google.com/mail/u/0/#all/' + token;
    } else {
      var keep = [];
      u.searchParams.forEach(function (v, k) { if (!TRACKING.test(k)) keep.push([k, v]); });
      var q = keep.map(function (p) { return encodeURIComponent(p[0]) + '=' + encodeURIComponent(p[1]); }).join('&');
      var port = u.port ? ':' + u.port : '';
      canonical = u.protocol + '//' + host + port + (path.replace(/\/+$/, '') || '/') + (q ? '?' + q : '');
      if (/(^|\.)outlook\.(office|live)\.com$|(^|\.)outlook\.office365\.com$/.test(host) && /\/mail\//.test(path)) kind = 'email';
      else if (/(^|\.)notion\.so$|(^|\.)notion\.site$/.test(host)) kind = 'note';
      id = 'url:' + canonical;
    }
    return { ok: true, desc: { id: id, kind: kind, title: cleanTitle(title) || canonical, locator: { type: 'url', value: canonical },
      sourceTime: null, sourceTimeType: 'unknown', sourceCreated: null } };
  }

  var EXT_KIND = { eml: 'email', xlsx: 'workbook', xlsm: 'workbook', xls: 'workbook', csv: 'workbook', tsv: 'workbook', numbers: 'workbook', ods: 'workbook',
    md: 'note', markdown: 'note', txt: 'note', text: 'note' };
  function kindForPath(p) {
    var m = String(p).match(/\.([A-Za-z0-9]+)$/);
    return (m && EXT_KIND[m[1].toLowerCase()]) || 'file';
  }
  function fileId(realPath) { return 'file:' + String(realPath).normalize('NFC'); }
  function messageId(raw) {
    var s = String(raw == null ? '' : raw).trim().replace(/^<|>$/g, '').trim();
    return s ? 'mid:' + s : null;
  }
  var TITLE_AS_IS = /^\S(?:[^\s\u0000-\u001F\u007F\u2028\u2029]| (?! ))*$/;
  function cleanTitle(t) { if (typeof t === 'string' && t.length <= 200 && TITLE_AS_IS.test(t) && t.charAt(t.length - 1) !== ' ') return t; return String(t == null ? '' : t).replace(/[\u0000-\u001F\u007F\u2028\u2029]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 200); }
  function oneLine(t) { return String(t == null ? '' : t).replace(/\s*[\r\n\u2028\u2029]+\s*/g, ' ').trim(); }

    } else if (a.id === 'copyBtn' && key === 'ArrowUp') { e.preventDefault(); focusOn('tick:' + ui.cur); }
    else if (a.id === 'manageSearch' && key === 'ArrowDown') { var first = $('manageList').querySelector('.tagrow'); if (first) { e.preventDefault(); first.focus(); } }
    else if (a.parentNode && a.parentNode.id === 'footer' && (key === 'ArrowLeft' || key === 'ArrowRight' || key === 'Home' || key === 'End')) {
      var tools = siblings(a, '.tool'); e.preventDefault();
      if (key === 'Home') tools[0].focus(); else if (key === 'End') tools[tools.length - 1].focus(); else step(tools, a, key === 'ArrowLeft' ? -1 : 1);
    }
    else if (a.classList.contains('tagrow')) {
      var rowsM = siblings(a, '.tagrow');
      if (key === 'ArrowDown') { e.preventDefault(); step(rowsM, a, 1); }
      else if (key === 'ArrowUp') { e.preventDefault(); if (!step(rowsM, a, -1)) focusOn('manageSearch'); }
    }
  });

  /* called by the Mac app each time the icon is clicked, with the app that was in front; and when the popover closes */
  window.workIndexOpened = function (info) { forgetReturn.forEach(function (f) { f(); }); if (info && info.room > 0) room = info.room; return opened(info); };
  window.workIndexClosed = function () { forgetReturn.forEach(function (f) { f(); }); ui = fresh(); $('lookupField').value = ''; $('tagField').value = ''; $('manageSearch').value = ''; $('renameField').value = ''; return pop.closed().then(function (v) { render(v, true); return v; }); };
  window.workIndexPreview = function () { return pop.preview(); };
  /* anything that changes the page's own height between renders (a message, a font) is fitted once per frame.
     What fit() does to the lists leaves the page at the size it measured, so this does not call itself again. */
  var fitting = 0;
  if (typeof ResizeObserver === 'function') new ResizeObserver(function () { if (!fitting) fitting = requestAnimationFrame(function () { fitting = 0; fit(); }); }).observe($('frame'));
  render(pop.view(), true);
  if (!native && !pretend) $('noneMsg').textContent = 'This is the contexta popover. It works inside the Mac app.';
})();
